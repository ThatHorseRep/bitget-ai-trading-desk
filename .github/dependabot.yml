version: 2
updates:
  # Weekly npm dependency updates (minor/patch only; security bumps
  # land directly on main via explicit commits per this repo's practice)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"
    open-pull-requests-limit: 5

  # GitHub Actions version bumps for CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
