name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build core
        run: npm run build:core

      - name: Tests (build:core + full suite)
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Report failing tests
        if: failure()
        run: |
          echo "failing test count: $(grep -c '^not ok' test-output.txt || true)"
          # Emit each failing test as a GitHub error annotation - these are
          # visible via the public check-runs API without a token.
          grep '^not ok' test-output.txt | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          {
            echo "## Failing tests"
            echo '```'
            grep -A10 '^not ok' test-output.txt || echo '(no TAP not-ok lines found)'
            echo '```'
            echo '## Suite tail'
            echo '```'
            tail -20 test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.txt

      - name: Report build failure
        if: failure()
        run: |
          if [ -f build-output.txt ]; then
            echo "## Build failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -50 build-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -20 build-output.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
