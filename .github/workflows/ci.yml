name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build core
        run: npm run build:core

      - name: Tests (build:core + full suite)
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Report failing tests
        if: failure()
        run: |
          {
            echo "## Failing tests"
            echo '```'
            grep -A10 '^not ok' test-output.txt || echo '(no TAP not-ok lines found)'
            echo '```'
            echo '## Suite tail'
            echo '```'
            tail -20 test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Production build
        run: npm run build
